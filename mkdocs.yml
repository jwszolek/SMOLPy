site_name: SMOLPy
site_description: Network simulation DSL and discrete-event simulator
site_url: https://jwszolek.github.io/SMOLPy/
repo_url: https://github.com/jwszolek/SMOLPy
repo_name: jwszolek/SMOLPy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - DSL Reference: dsl-reference.md
  - SMOL Language Reference: language-reference.md
  - MQTT: mqtt.md
  - Modbus TCP: modbus.md
  - PROFINET RT: profinet.md
  - Simulation Engine: simulation-engine.md
  - Dashboard: dashboard.md
  - Examples: examples.md
  - Roadmap: roadmap.md
  - Architecture Decision Records:
      - ADR-0001 Protocol Package Structure: adr/0001-protocol-package-structure.md
      - ADR-0002 Modbus TCP Implementation: adr/0002-modbus-tcp-implementation.md
      - ADR-0003 SMOL External DSL: adr/0003-smol-external-dsl.md
      - ADR-0004 Pluggable Execution Backends: adr/0004-execution-backends.md
      - ADR-0005 PROFINET RT Cyclic I/O: adr/0005-profinet-rt.md
      - ADR-0006 Profiling and Baseline Benchmark: adr/0006-profiling-and-baseline-benchmark.md
      - ADR-0007 Execution-Independent Scenario Model: adr/0007-execution-independent-scenario-model.md
      - ADR-0008 Rust DES Engine (MVP): adr/0008-rust-des-engine-mvp.md
      - ADR-0009 Batch Execution and Cross-Backend Validation: adr/0009-batch-execution-and-cross-backend-validation.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
