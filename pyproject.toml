[project]
name = "smolpy"
dynamic = ["version"]
description = "Network simulation DSL and discrete-event simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "simpy>=4.1",
    "networkx>=3.3",
    "plotly>=5.22",
    "dash>=2.17",
    "rich>=13",
    "dearpygui>=1.6",
    "lark>=1.2",
]

[project.scripts]
smolpy = "smolpy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
docs = ["mkdocs-material>=9"]
# The native Rust engine (ADR-0008), released together with smolpy and with
# the same version. At import smolpy checks the IR version the module reads,
# and each run checks its capabilities. 1.15.0 runs everything up to ADR-0015:
# a shared pool, reserves and drains; an older engine refuses a run that needs
# what it lacks, by its capabilities. The floor is a release: a pre-release
# in it would let pip pick the development builds published to PyPI.
rust = ["smolpy-engine-rs>=1.15.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

# A commit N commits after tag vX.Y.Z is X.Y.(Z+1).devN, with no "+g<hash>"
# local part: PyPI rejects local versions, and development builds go there.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/smolpy"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]
docs = ["mkdocs-material>=9"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/smolpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
