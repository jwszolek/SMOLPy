name: Docker image

# The images of ghcr.io/jwszolek/smolpy (ADR-0004, Container images), from
# the wheels of one version of smolpy and smolpy-engine-rs:
# - <version>, latest: without ns-3, for linux/amd64 and linux/arm64;
# - <version>-ns3, latest-ns3: on the ns-3 base image, with smol-ns3 built
#   in, for linux/amd64 and linux/arm64. Each platform is built and tested
#   on a runner of its own architecture, as smol-ns3 is compiled in the
#   image; it is pushed as <version>-ns3-<arch>, and the two tags are the
#   multi-platform index of both.
# Every image is tested before anything is pushed: a .smol run through the
# CLI; the wheel smoke test (bit-exact with SimPy) without ns-3, and the ns-3
# suite with it.
#
# - Called by publish.yml at a release, once both packages are on PyPI: uses
#   the files of the same run and pushes both images.
# - On a pull request that touches the images: builds the wheels here, tests
#   the image without ns-3 for linux/amd64 and the image with ns-3 for both
#   platforms, and pushes nothing.

on:
  pull_request:
    paths:
      - "docker/Dockerfile*"
      - "docker/smoke.smol"
      - ".github/workflows/docker-image.yml"
  workflow_call:
    inputs:
      version:
        description: The release version, e.g. 1.9.0
        required: true
        type: string
      ref:
        description: The release tag, e.g. v1.9.0
        required: true
        type: string

jobs:
  image:
    name: ${{ inputs.version && format('Image {0}', inputs.version) || 'Image (test build)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smolpy
      RELEASE: ${{ inputs.version && 'true' || 'false' }}  # no inputs on a pull request

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # hatch-vcs numbers a test build from git

      # --- a release: the files the calling run has published ---

      - name: Download smolpy
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download smolpy-engine-rs
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: dist/

      # --- a pull request: both wheels built here, with one version ---

      - name: Install uv
        if: ${{ env.RELEASE != 'true' }}
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build smolpy and number the engine alike
        if: ${{ env.RELEASE != 'true' }}
        run: |
          uv build --wheel
          wheels=(dist/smolpy-*.whl)  # smolpy-<version>-py3-none-any.whl
          VERSION=$(basename "${wheels[0]}" | cut -d- -f2)
          CARGO_VERSION=$(echo "$VERSION" | sed -E 's/\.dev([0-9]+)$/-dev.\1/')
          sed -i "s/^dynamic = \[\"version\"\]$/version = \"$VERSION\"/" rust/smolpy-engine-rs/pyproject.toml
          sed -i "s/^version = \"[^\"]*\"$/version = \"$CARGO_VERSION\"/" rust/Cargo.toml
          echo "Test build of version $VERSION"

      - name: Build smolpy-engine-rs
        if: ${{ env.RELEASE != 'true' }}
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist -m rust/smolpy-engine-rs/Cargo.toml

      # for the ns-3 image on linux/arm64
      - name: Build smolpy-engine-rs for aarch64
        if: ${{ env.RELEASE != 'true' }}
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          args: --release --out dist -m rust/smolpy-engine-rs/Cargo.toml

      # --- the image ---

      - name: Version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            wheels=(dist/smolpy-*.whl)
            VERSION=$(basename "${wheels[0]}" | cut -d- -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls dist/

      # the same wheels, for the ns-3 image
      - name: Keep the wheels
        uses: actions/upload-artifact@v4
        with:
          name: image-wheels
          path: dist/*.whl
          retention-days: 1

      - name: Set up QEMU, for linux/arm64
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and test each platform
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PLATFORMS: ${{ env.RELEASE == 'true' && 'linux/amd64 linux/arm64' || 'linux/amd64' }}
        run: |
          for platform in $PLATFORMS; do
            echo "::group::$platform"
            docker buildx build --platform "$platform" --load \
              --build-arg VERSION="$VERSION" -f docker/Dockerfile -t smolpy:test .
            docker run --rm --platform "$platform" smolpy:test --help
            # the wheel smoke test: bit-exact with SimPy on this platform
            docker run --rm --platform "$platform" -v "$PWD/rust/smolpy-engine-rs:/test:ro" \
              --entrypoint python smolpy:test /test/smoke_test.py
            # the CLI, as a user runs it, writing to the mounted directory
            mkdir -p out && chmod 777 out
            cp docker/smoke.smol out/
            docker run --rm --platform "$platform" -v "$PWD/out:/work" \
              smolpy:test run smoke.smol --backend rust -o results.csv
            grep -q "pn_latency:plc" out/results.csv
            rm -rf out
            echo "::endgroup::"
          done

      - name: Log in to ghcr.io
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the platforms tested above, rebuilt from the build cache
      - name: Push
        if: ${{ env.RELEASE == 'true' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$VERSION" -f docker/Dockerfile \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          echo "Pushed $IMAGE:$VERSION and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"

  image-ns3:
    name: ${{ inputs.version && format('Image {0}-ns3', inputs.version) || 'Image with ns-3 (test build)' }}, ${{ matrix.platform }}
    needs: image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write  # push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smolpy
      RELEASE: ${{ inputs.version && 'true' || 'false' }}
      VERSION: ${{ needs.image.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          name: image-wheels
          path: dist/

      - uses: docker/setup-buildx-action@v3

      # smol-ns3 is built into the image; its cache is read-only, so a run
      # below that needed another build would fail
      - name: Build
        run: |
          docker buildx build --platform "${{ matrix.platform }}" --load \
            --build-arg VERSION="$VERSION" -f docker/Dockerfile.ns3 -t smolpy:test-ns3 .
          docker image inspect --format '{{.Os}}/{{.Architecture}}' smolpy:test-ns3 \
            | grep -qx "${{ matrix.platform }}"
          docker image ls smolpy:test-ns3

      - name: Test the CLI on ns-3
        run: |
          docker run --rm smolpy:test-ns3 --version | grep -qx "smolpy $VERSION"
          mkdir -p out && chmod 777 out
          cp docker/smoke.smol out/
          docker run --rm -v "$PWD/out:/work" \
            smolpy:test-ns3 run smoke.smol --backend ns3 -o results.csv
          grep -q "pn_latency:plc" out/results.csv
          grep -q "modbus_latency:plc" out/results.csv
          rm -rf out

      # the tests of this version, against the smolpy installed in the image
      - name: Run the ns-3 suite in the image
        run: |
          docker run --rm --user 0 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tests:/src/tests:ro" -w /src --entrypoint sh smolpy:test-ns3 -c \
            "pip install --quiet --root-user-action=ignore pytest \
             && python -m pytest -p no:cacheprovider tests/equivalence tests/test_ns3.py -k ns3 -q"

      - name: Log in to ghcr.io
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: ${{ env.RELEASE == 'true' }}
        run: |
          docker tag smolpy:test-ns3 "$IMAGE:$VERSION-ns3-${{ matrix.arch }}"
          docker push "$IMAGE:$VERSION-ns3-${{ matrix.arch }}"
          echo "Pushed $IMAGE:$VERSION-ns3-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"

  # <version>-ns3 and latest-ns3: one tag for both platforms, from the images
  # tested above
  image-ns3-index:
    name: Image ${{ inputs.version }}-ns3, both platforms
    needs: [image, image-ns3]
    if: ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smolpy
      VERSION: ${{ needs.image.outputs.version }}

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the index
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION-ns3" -t "$IMAGE:latest-ns3" \
            "$IMAGE:$VERSION-ns3-amd64" "$IMAGE:$VERSION-ns3-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION-ns3"
          echo "Pushed $IMAGE:$VERSION-ns3 and $IMAGE:latest-ns3 for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
