name: GitHub Release

# Creates the GitHub Release of a tag, with notes generated from the pull
# requests since the previous tag and the sdist and wheel built from the tag.
# Called by publish.yml once the tag is on PyPI; run it by hand to add the
# release of an existing tag. A release that exists already gets its files
# replaced and keeps its notes.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create the GitHub Release for, e.g. v1.6.0
        required: true
        type: string

permissions:
  contents: write  # create the release and upload its files

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0  # hatch-vcs reads the version from the tag

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
