name: ns-3 base image

# ghcr.io/jwszolek/smolpy-ns3-base:<ns-3 version> (ADR-0004, Container
# images): the pinned ns-3 release, built once. It is rebuilt only when its
# Dockerfile changes, which is how the pinned release changes, so releases
# never build ns-3. linux/amd64 for now; linux/arm64 is to follow on a native
# runner, as an emulated build of ns-3 would take hours.
#
# Every build is tested before it is pushed: a scratch program, as the ns-3
# backend's generated scenarios will be, built and run against it.
#
# - On a pull request that changes it: build and test, push nothing.
# - After the merge to main, or run by hand: build, test and push.

on:
  push:
    branches:
      - main
    paths:
      - "docker/ns3-base/**"
      - ".github/workflows/ns3-base.yml"
  pull_request:
    paths:
      - "docker/ns3-base/**"
      - ".github/workflows/ns3-base.yml"
  workflow_dispatch:

jobs:
  image:
    name: ns-3 base image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write  # push to ghcr.io

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smolpy-ns3-base
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: The pinned ns-3 release
        id: v
        run: |
          VERSION=$(sed -nE 's/^ARG NS3_VERSION=(.+)$/\1/p' docker/ns3-base/Dockerfile)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ns-3 $VERSION"

      - uses: docker/setup-buildx-action@v3

      # the layers of an unchanged ns-3 build come from the cache
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker/ns3-base
          platforms: linux/amd64
          load: true
          tags: ns3-base:test
          cache-from: type=gha,scope=ns3-base
          cache-to: type=gha,scope=ns3-base,mode=max

      - name: Test with a scratch program
        run: |
          docker run --rm -v "$PWD/docker/ns3-base/smoke.cc:/opt/ns-3/scratch/smoke.cc:ro" \
            ns3-base:test ./ns3 run smoke
          docker image ls ns3-base:test

      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: ${{ env.PUSH == 'true' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker tag ns3-base:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          echo "Pushed $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
