name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Not the rust extra: the published engine would be tested against this
      # change's model. The rust job below tests the engine built from it.
      - name: Install dependencies
        run: uv sync --all-extras --no-extra rust

      - name: Lint — ruff check
        run: uv run ruff check src/

      - name: Lint — ruff format check
        run: uv run ruff format --check src/

      - name: Type check — mypy
        run: uv run mypy src/smolpy/
        continue-on-error: true   # treat type errors as warnings until stubs are complete

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  rust:
    name: Rust engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format — cargo fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: Lint — cargo clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests — cargo test
        working-directory: rust
        run: cargo test

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --no-extra rust --python 3.12

      - name: Build the Python module (maturin)
        run: uvx maturin build --release -m rust/smolpy-engine-rs/Cargo.toml -o dist-rust

      - name: Install the Python module
        run: uv pip install dist-rust/smolpy_engine_rs-*.whl

      # --no-sync keeps the module just installed; the check makes sure the
      # equivalence tests below run the Rust backend instead of skipping it.
      - name: Check that the rust backend is installed
        run: uv run --no-sync python -c "from smolpy import backends; assert 'rust' in backends.installed(), backends.installed()"

      - name: Equivalence with SimPy (bit for bit)
        run: uv run --no-sync pytest tests/equivalence tests/test_backends.py -v --tb=short
